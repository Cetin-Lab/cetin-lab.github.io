name: Update publications from Google Scholar
on:
  workflow_dispatch:
  schedule:
    - cron: '18 8 1 * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
        python -m pip install 'scholarly>=1.7,<2'
        python -m pip install "bibtexparser==1.4.3"
      - name: Retrieve bibliography
        run: python scripts/update_publications.py
      - name: Commit updates if changed
        run: |
          if git diff --quiet -- assets/data/publications.json; then
            echo 'No publication changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/publications.json
          git commit -m 'Update Google Scholar publications'
          git push
